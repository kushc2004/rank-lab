# Project-side Kaggle launch contract. Kaggle CLI itself reads
# kernel-metadata.json; this file documents the immutable source and reusable
# derived-artifact inputs.
kernel:
  metadata: kernel-metadata.json
  notebook: notebooks/kaggle_full_pipeline.ipynb
  accelerator: NvidiaTeslaT4
inputs:
  raw_data:
    dataset: kushchaudhari/kuairand-pure-official
    archive: KuaiRand-Pure.tar.gz
    source: https://zenodo.org/records/10439422
    md5: 0820331067a3784d9691136f772b35a7
  artifact_cache:
    dataset: kushchaudhari/ranklab-baseline-artifacts
    archive: ranklab_artifacts.tar.gz
    contains_raw_data: false
resume:
  state: outputs/full_pipeline_state.json
  compatibility: raw file sizes + merged config + implementation sha256
outputs:
  archive: artifacts/kaggle/ranklab_artifacts.tar.gz
