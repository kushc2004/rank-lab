[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ranklab"
version = "0.1.0"
description = "Leakage-safe retrieval, ranking, debiasing, and evaluation for KuaiRand-Pure"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "PyYAML>=6.0", "matplotlib>=3.8", "pyarrow>=15", "torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
full = [
  "scipy>=1.12",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "faiss-cpu>=1.8",
  "joblib>=1.3",
  "plotly>=5.20",
  "streamlit>=1.33",
]
ope = ["obp>=0.5.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
