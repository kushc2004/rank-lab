[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ranklab"
version = "0.1.0"
description = "Leakage-safe baseline experiments for KuaiRand-Pure"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "PyYAML>=6.0", "matplotlib>=3.8", "pyarrow>=15", "torch>=2.2"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
