embedding_dim: 64
epochs: 8
batch_size: 2048
learning_rate: 0.001
temperature: 0.07
device: auto
use_side_features: false
history_length: 50
negative_strategy: random
hard_negative_refresh: false
hard_negative_epochs: 1
candidate_k: 200
max_train_contexts: 25000
max_validation_contexts: 5000
max_test_contexts: 5000
ranker_holdout_fraction: 0.20
relevance_mode: binary
run_relevance_ablation: true
run_retrieval_ablations: true
retrieval_ablation_strategies: [random, exposed_mixed]
retrieval_ablation_hard_refresh: [false, true]
retrieval_k_values: [50, 100, 200]
retrieval_selection_metric: recall@200
retrieval_selection_tiebreaker: ndcg@200
session_gap_minutes: 30
context_window_size: 20
